name: Applitools Visual Tests

on:
  pull_request:
    branches: [tests, main, master]

concurrency:
  group: applitools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  APPLITOOLS_BATCH_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  CI: true
  HAS_APPLITOOLS_READ_KEY: ${{ secrets.APPLITOOLS_READ_KEY != '' }}
  HAS_APPLITOOLS_WRITE_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY != '' }}
  HAS_CURSOR_KEY: ${{ secrets.CURSOR_API_KEY != '' }}

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Applitools visual tests
        id: visual
        continue-on-error: true
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
        run: npx playwright test tests/login.visual.spec.ts --project=chromium

      - name: Resolve Eyes batch URL
        if: always() && steps.visual.outcome == 'failure' && (env.HAS_APPLITOOLS_WRITE_KEY == 'true' || env.HAS_APPLITOOLS_READ_KEY == 'true')
        env:
          APPLITOOLS_LOOKUP_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY || secrets.APPLITOOLS_READ_KEY }}
        run: |
          fallback="https://eyes.applitools.com/app/test-results/${APPLITOOLS_BATCH_ID}"
          url=$(curl -sS -H "X-Eyes-Api-Key: ${APPLITOOLS_LOOKUP_KEY}" \
            "https://eyesapi.applitools.com/api/v1/batches/${APPLITOOLS_BATCH_ID}?statsOnly=true" \
            | python3 -c "import json,sys; print((json.load(sys.stdin).get('batchUrl') or '').strip())" \
            || true)
          if [ -z "$url" ]; then
            url="$fallback"
          fi
          echo "EYES_BATCH_URL=${url}" >> "$GITHUB_ENV"
          echo "Using Eyes batch URL ${url}"

      - name: Install Cursor CLI
        if: always() && steps.visual.outcome == 'failure' && env.HAS_CURSOR_KEY == 'true' && (env.HAS_APPLITOOLS_WRITE_KEY == 'true' || env.HAS_APPLITOOLS_READ_KEY == 'true')
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Write key: add regions, accept expected diffs, reject bugs.
      # Do not save — pending decisions stay undoable until someone saves
      # in Eyes or a gated workflow calls eyes_resolve_save.
      - name: Resolve visual differences
        if: always() && steps.visual.outcome == 'failure' && env.HAS_CURSOR_KEY == 'true' && env.HAS_APPLITOOLS_WRITE_KEY == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          APPLITOOLS_WRITE_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY }}
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          COMMIT_SUBJECT=$(git log -1 --format='%s')
          cursor-agent --print --force --trust --sandbox disabled --approve-mcps \
            --output-format text \
            "Resolve the Applitools Eyes batch at ${EYES_BATCH_URL}

            Use the Applitools MCP tools with the write-scoped key already in
            APPLITOOLS_API_KEY / APPLITOOLS_WRITE_KEY.

            Call eyes_review_progress with mode resolve. Follow each response's
            next field until eyes_review_end reports the batch complete.

            Copy or text diffs that match this pull request (${PR_TITLE}) or
            commit (${COMMIT_SUBJECT}) may be expected (isExpected).

            Color and styling diffs are unexpected in this run — including
            the gold Sign in heading and the orange Sign in button. Do not
            mark those as isExpected just because they appear in the commit.
            Leave isExpected and isBug null so the steps stay unresolved
            for human review.

            Mask dynamic or recurring content with match regions (prefer
            dynamic, then layout). Do not treat those as bugs.

            Never call eyes_resolve_save. Never call eyes_resolve_reset unless
            a tool error requires retrying. Leave decisions pending.

            Write a markdown report to triage.md covering each distinct diff,
            whether it was accepted or rejected, and which regions were added.
            Do not modify any other file." \
            2>&1 | tee triage.log

      # Read-only fallback when write key is missing.
      - name: Inspect visual differences (read-only)
        if: always() && steps.visual.outcome == 'failure' && env.HAS_CURSOR_KEY == 'true' && env.HAS_APPLITOOLS_WRITE_KEY != 'true' && env.HAS_APPLITOOLS_READ_KEY == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          APPLITOOLS_READ_KEY: ${{ secrets.APPLITOOLS_READ_KEY }}
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_READ_KEY }}
        run: |
          cursor-agent --print --force --trust --sandbox disabled --approve-mcps \
            --output-format text \
            "Inspect the Applitools Eyes batch at ${EYES_BATCH_URL}

            Use the Applitools MCP tools with the read-scoped key already in
            APPLITOOLS_API_KEY / APPLITOOLS_READ_KEY. Call
            eyes_review_progress with mode inspect — never resolve, never
            accept, never reject, never add or change match regions, never
            save. Follow each response's next field until eyes_review_end
            reports the batch complete.

            Write a markdown report of the visual differences and their likely
            root cause to triage.md in the repository root. Do not modify any
            other file." \
            2>&1 | tee triage.log

      - name: Comment that Eyes review was skipped
        if: always() && github.event_name == 'pull_request' && steps.visual.outcome == 'failure' && (env.HAS_CURSOR_KEY != 'true' || (env.HAS_APPLITOOLS_WRITE_KEY != 'true' && env.HAS_APPLITOOLS_READ_KEY != 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<'EOF'
          ## Eyes review skipped

          Visual tests failed, but MCP review did not run.

          Add these GitHub Actions secrets, then re-run:
          - `CURSOR_API_KEY` — Cursor API key for `cursor-agent`
          - `APPLITOOLS_WRITE_KEY` — Applitools key with **write** permission (regions, accept/reject). CI still does not save.
          - `APPLITOOLS_READ_KEY` — fallback for inspect-only if write is not set. The capture secret `APPLITOOLS_API_KEY` is execute-only and cannot review results.
          EOF
          )"

      - name: Upload Eyes review report
        if: always() && hashFiles('triage.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: eyes-review-report
          path: |
            triage.md
            triage.log

      - name: Comment Eyes review on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('triage.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Eyes review report"
            echo
            if [ "${HAS_APPLITOOLS_WRITE_KEY}" = "true" ]; then
              echo "Resolve mode on batch [${EYES_BATCH_URL}](${EYES_BATCH_URL}). Regions / accept / reject are **pending** and were **not** saved to the baseline."
            else
              echo "Read-only inspect of batch [${EYES_BATCH_URL}](${EYES_BATCH_URL}). Nothing was accepted, rejected, or saved."
            fi
            echo
            cat triage.md
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

      - name: Fail the job if visual tests failed
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
