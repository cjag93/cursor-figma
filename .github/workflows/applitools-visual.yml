name: Applitools Visual Tests

on:
  pull_request:
    branches: [tests, main, master]

concurrency:
  group: applitools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  APPLITOOLS_BATCH_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  APPLITOOLS_BATCH_BUILD_ID: ${{ github.run_id }}
  CI: true
  HAS_APPLITOOLS_KEY: ${{ secrets.APPLITOOLS_API_KEY != '' }}
  HAS_APPLITOOLS_READ_KEY: ${{ secrets.APPLITOOLS_READ_KEY != '' }}
  HAS_CURSOR_KEY: ${{ secrets.CURSOR_API_KEY != '' }}

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Applitools visual tests
        id: visual
        continue-on-error: true
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
        run: npx playwright test tests/login.visual.spec.ts --project=chromium

      # Optional: tells Eyes the GitHub build is finished so it can update
      # commit status. 404 means the Applitools GitHub app is not connected
      # to this repo — inspect does not need that integration.
      - name: Complete Applitools batch
        if: always() && env.HAS_APPLITOOLS_KEY == 'true'
        continue-on-error: true
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
        run: |
          status=$(curl -sS -o /tmp/eyes-complete.out -w "%{http_code}" -X POST \
            -H "accept:*/*" -d '' \
            "https://eyesapi.applitools.com/api/externals/github/servers/github.com/commit/${APPLITOOLS_BATCH_ID}/${APPLITOOLS_BATCH_BUILD_ID}/complete?apiKey=${APPLITOOLS_API_KEY}")
          echo "Applitools GitHub complete returned HTTP ${status}"
          if [ "$status" = "404" ]; then
            echo "No GitHub SCM integration for this batch; continuing to inspect."
            exit 0
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat /tmp/eyes-complete.out
            exit 1
          fi

      - name: Install Cursor CLI
        if: always() && steps.visual.outcome == 'failure' && env.HAS_CURSOR_KEY == 'true' && env.HAS_APPLITOOLS_READ_KEY == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # MCP review tools need a read-scoped key. The capture secret is
      # execute-only and returns 403 from eyes_review_progress.
      - name: Inspect visual differences (read-only)
        if: always() && steps.visual.outcome == 'failure' && env.HAS_CURSOR_KEY == 'true' && env.HAS_APPLITOOLS_READ_KEY == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          APPLITOOLS_READ_KEY: ${{ secrets.APPLITOOLS_READ_KEY }}
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_READ_KEY }}
        run: |
          cursor-agent --print --force --trust --sandbox disabled --approve-mcps \
            --output-format text \
            "Inspect the Applitools Eyes batch at
            https://eyes.applitools.com/app/test-results/${APPLITOOLS_BATCH_ID}

            Use the Applitools MCP tools with the read-scoped key already in
            APPLITOOLS_API_KEY / APPLITOOLS_READ_KEY. Call
            eyes_review_progress with mode inspect — never resolve, never
            accept, never reject, never add or change match regions, never
            save. Follow each response's next field until eyes_review_end
            reports the batch complete.

            Write a markdown report of the visual differences and their likely
            root cause to triage.md in the repository root. Do not modify any
            other file." \
            2>&1 | tee triage.log

      - name: Comment that inspect was skipped
        if: always() && github.event_name == 'pull_request' && steps.visual.outcome == 'failure' && (env.HAS_CURSOR_KEY != 'true' || env.HAS_APPLITOOLS_READ_KEY != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<'EOF'
          ## Eyes inspect skipped

          Visual tests failed, but read-only MCP inspect did not run.

          Add these GitHub Actions secrets, then re-run:
          - `CURSOR_API_KEY` — Cursor API key for `cursor-agent`
          - `APPLITOOLS_READ_KEY` — Applitools key with **read** permission (Admin → Teams → API Keys). The capture secret `APPLITOOLS_API_KEY` is execute-only and cannot call `eyes_review_progress`.
          EOF
          )"

      - name: Upload inspect report
        if: always() && hashFiles('triage.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: eyes-inspect-report
          path: |
            triage.md
            triage.log

      - name: Comment inspect report on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('triage.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Eyes inspect report"
            echo
            echo "Read-only review of batch [\`${APPLITOOLS_BATCH_ID}\`](https://eyes.applitools.com/app/test-results/${APPLITOOLS_BATCH_ID}). Nothing was accepted, rejected, or saved."
            echo
            cat triage.md
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

      - name: Fail the job if visual tests failed
        if: always() && steps.visual.outcome == 'failure'
        run: exit 1
