<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>log in</title>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <main class="aeo" data-testid="login-page">
      <form class="aeo-card" id="login-form" novalidate>
        <img class="aeo-logo" src="img/aeo-logo.png" alt="" />

        <p
          id="login-error"
          class="aeo-error"
          role="alert"
          data-testid="login-error"
        >
          Invalid username or password.
        </p>

        <button type="submit" class="aeo-login" data-testid="login-button">
          log in
        </button>

        <input
          id="email"
          name="email"
          class="aeo-field aeo-field--user"
          type="text"
          autocomplete="username"
          placeholder="Usernameee"
          data-testid="email-input"
          required
        />

        <input
          id="password"
          name="password"
          class="aeo-field aeo-field--pass"
          type="password"
          autocomplete="current-password"
          placeholder="Passwordd"
          data-testid="password-input"
          required
        />

        <span class="aeo-rule aeo-rule--left" aria-hidden="true"></span>
        <span class="aeo-rule aeo-rule--right" aria-hidden="true"></span>

        <button type="button" class="aeo-google">Google</button>
        <a class="aeo-new" href="#">New User?</a>
      </form>
    </main>

    <script src="js/login.js"></script>
  </body>
</html>
